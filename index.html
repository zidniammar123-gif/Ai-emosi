
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Buatanku</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101322;
  color: white;
}

header {
  padding: 18px;
  text-align: center;
  background: #1b2040;
  border-bottom: 1px solid #353b60;
}

header h2 { margin: 0 0 6px; }
header p { margin: 0; color: #aab4d9; }

#chat {
  height: calc(100dvh - 210px);
  min-height: 250px;
  overflow-y: auto;
  padding: 16px;
}

.msg {
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 16px;
  max-width: 88%;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user {
  background: #5368ed;
  margin-left: auto;
}

.bot {
  background: #252b46;
  margin-right: auto;
}

#status {
  text-align: center;
  color: #aab4d9;
  font-size: 13px;
  padding: 6px;
}

.controls {
  position: sticky;
  bottom: 0;
  padding: 12px;
  background: #1b2040;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 120px;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #454d78;
  background: #101322;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  color: white;
  background: #5368ed;
}

#mic { background: #168b70; }
#stop { background: #a34354; }

</style>
</head>

<body>
<header>
  <h2>🤖 AI Buatanku</h2>
  <p>Asisten suara pribadi</p>
</header>

<div id="chat">
  <div class="msg bot">
    Halo! Aku asisten buatanmu.
    Coba ketik pesan atau tekan 🎤 untuk berbicara!
  </div>
</div>

<div id="status">Siap menerima pesan</div>

<div class="controls">
  <input id="input" placeholder="Tulis pesan..." />
  <button id="send">Kirim</button>
  <button id="mic">🎤</button>
  <button id="stop">■</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusText = document.getElementById("status");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function think(text) {
  const t = text.toLowerCase();

  if (t.includes("halo") || t.includes("hai")) {
    return "Halo juga! Ada yang bisa aku bantu?";
  }
  if (t.includes("nama")) {
    return "Aku AI Buatanmu. Kamu boleh memberiku nama sendiri!";
  }
  if (t.includes("kamu siapa")) {
    return "Aku asisten virtual yang sedang kamu buat.";
  }
  if (t.includes("jam")) {
    return "Waktu di perangkatmu sekarang " +
      new Date().toLocaleTimeString("id-ID") + ".";
  }
  if (t.includes("terima kasih")) {
    return "Sama-sama! Senang bisa membantu.";
  }

  return "Aku menerima pesanmu: \"" + text +
    "\". Untuk menjawab pertanyaan lebih pintar, " +
    "nanti kita hubungkan aku ke model AI sungguhan.";
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    statusText.textContent = "Suara tidak didukung browser ini.";
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "id-ID";
  utterance.rate = 1;
  utterance.pitch = 1;

  utterance.onstart = () => {
    statusText.textContent = "AI sedang berbicara...";
  };
  utterance.onend = () => {
    statusText.textContent = "Siap menerima pesan";
  };

  speechSynthesis.speak(utterance);
}

function sendMessage(text) {
  text = text.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const reply = think(text);
  addMessage(reply, "bot");
  speak(reply);
}

document.getElementById("send").onclick = () => {
  sendMessage(input.value);
};

input.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage(input.value);
});

document.getElementById("stop").onclick = () => {
  speechSynthesis.cancel();
  statusText.textContent = "Suara dihentikan";
};

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "id-ID";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    statusText.textContent = "Mendengarkan suara...";
    document.getElementById("mic").textContent = "🔴";
  };

  recognition.onresult = event => {
    const text = event.results[0][0].transcript;
    input.value = text;
    sendMessage(text);
  };

  recognition.onerror = event => {
    statusText.textContent =
      "Mikrofon bermasalah: " + event.error;
  };

  recognition.onend = () => {
    document.getElementById("mic").textContent = "🎤";
    if (statusText.textContent === "Mendengarkan suara...") {
      statusText.textContent = "Siap menerima pesan";
    }
  };

  document.getElementById("mic").onclick = () => {
    try {
      recognition.start();
    } catch (e) {
      statusText.textContent =
        "Tunggu sebentar, lalu tekan mikrofon lagi.";
    }
  };
} else {
  document.getElementById("mic").onclick = () => {
    statusText.textContent =
      "Pengenalan suara tidak didukung. Coba Chrome.";
  };
}
</script>
</body>
  </html>
